name: Workcell CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  cpp:
    name: C++ Controller

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@7

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          cmake \
            -S controller \
            -B controller/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build controller
        run: |
          cmake --build controller/build

      - name: Run C++ tests
        run: |
          ctest \
            --test-dir controller/build \
            --output-on-failure

      - name: Run integrated controller demo
        run: |
          ./controller/build/integrated_demo

  dotnet:
    name: ASP.NET Service

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@7

      - name: Setup .NET
        uses: actions/setup-dotnet@6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore service/WorkcellService.slnx

      - name: Build service
        run: |
          dotnet build \
            service/WorkcellService.slnx \
            --no-restore \
            --configuration Release

      - name: Run .NET tests
        run: |
          dotnet test \
            service/WorkcellService.slnx \
            --no-build \
            --configuration Release