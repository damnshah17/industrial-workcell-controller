name: Workcell CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  cpp:
    name: C++ Controller

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          cmake \
            -S controller \
            -B controller/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build controller
        run: |
          cmake --build controller/build

      - name: Run C++ tests
        run: |
          ctest \
            --test-dir controller/build \
            --output-on-failure

      - name: Run integrated controller demo
        run: |
          ./controller/build/integrated_demo

  dotnet:
    name: ASP.NET Service

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: workcell_test
          POSTGRES_USER: workcell
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workcell -d workcell_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ConnectionStrings__WorkcellDatabase: Host=localhost;Port=5432;Database=workcell_test;Username=workcell;Password=ci-test-only
      WORKCELL_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=workcell_test;Username=workcell;Password=ci-test-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore service/WorkcellService.slnx

      - name: Build service
        run: |
          dotnet build \
            service/WorkcellService.slnx \
            --no-restore \
            --configuration Release

      - name: Run .NET tests
        run: |
          dotnet test \
            service/WorkcellService.slnx \
            --no-build \
            --configuration Release

      - name: Apply database migrations
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef database update \
            --project service/MachineService/MachineService.csproj \
            --no-build \
            --configuration Release
